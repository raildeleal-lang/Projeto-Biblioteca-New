<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca - BiblioGest</title>

    <!-- Importação da Fonte Moderna 'Inter' -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- CÓDIGO DO BOOTSTRAP EMBUTIDO (Evita bloqueios do navegador) -->
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 0; color: #334155; }

        /* Containers Bootstrap convertidos para CSS direto */
        .container { width: 100%; max-width: 1140px; margin-right: auto; margin-left: auto; padding-right: 15px; padding-left: 15px; }
        .d-flex { display: flex !important; }
        .justify-content-between { justify-content: space-between !important; }
        .align-items-center { align-items: center !important; }
        .mb-4 { margin-bottom: 1.5rem !important; }
        .me-2 { margin-right: 0.5rem !important; }
        .fw-bold { font-weight: 700 !important; }
        .text-white { color: #fff !important; }
        .shadow-sm { box-shadow: 0 .125rem .25rem rgba(0,0,0,.075) !important; }

        /* Navbar (Menu) no padrão verde escuro corporativo */
        .navbar { background-color: #1e7e53; padding: 1rem 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .navbar-brand { font-size: 1.25rem; color: #ffffff; text-decoration: none; font-weight: 700; display: flex; align-items: center; }
        .navbar-nav { display: flex; list-style: none; margin: 0; padding-left: 0; }
        .nav-link { color: rgba(255, 255, 255, 0.85); text-decoration: none; padding: 0.5rem 1rem; font-weight: 500; transition: color 0.2s; }
        .nav-link:hover { color: #ffffff; }

        /* Estrutura do Cartão Principal Brancos (Main Container) */
        .main-container { background-color: #ffffff; border-radius: 12px; padding: 30px; margin-top: 30px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid #eef2f5; }

        /* Botão Novo Usuário / Novo Livro no padrão verde */
        .btn-biblioteca { background-color: #1e7e53; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; transition: background 0.2s; font-size: 0.9rem; }
        .btn-biblioteca:hover { background-color: #165c3d; color: white; }

        /* Título */
        h2, h3 { color: #1e293b; margin: 0; font-weight: 700; }

        /* Estilização Completa e Espaçada das Tabelas (Igual ao seu modelo desejado) */
        .table-responsive { width: 100%; overflow-x: auto; }
        .custom-table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 15px; }
        .custom-table thead th { background-color: #f8fafc; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; padding: 16px; border-bottom: 2px solid #edf2f7; }
        .custom-table tbody tr { border-bottom: 1px solid #f1f5f9; transition: background 0.2s; }
        .custom-table tbody tr:hover { background-color: #f8fafc; }
        .custom-table tbody td { padding: 16px; font-size: 0.9rem; color: #334155; vertical-align: middle; }

        /* Badges/Etiquetas de Vínculo */
        .badge-aluno { background-color: #f1f5f9; color: #475569; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 500; border: 1px solid #e2e8f0; }
        .badge-professor { background-color: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 500; }
        .badge-servidor { background-color: #f5f5f4; color: #44403c; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 500; }

        /* Botões de Ações (Lápis e Lixeira) simples e elegantes */
        .action-link { color: #475569; text-decoration: none; font-size: 1.1rem; margin-left: 15px; transition: color 0.2s; }
        .action-link-edit:hover { color: #d97706; }
        .action-link-delete:hover { color: #dc2626; }
    </style>
</head>
<body>

    <!-- Menu Superior Organizado -->
    <nav class="navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand" href="{% url 'home' %}">
                🟢 BiblioGest
            </a>
            <ul class="navbar-nav d-flex" style="flex-direction: row;">
                <li><a class="nav-link" href="{% url 'home' %}">Início</a></li>
                <li><a class="nav-link" href="{% url 'lista_livros' %}">Livros</a></li>
                <li><a class="nav-link" href="{% url 'lista_usuarios' %}">Usuários</a></li>
                <li><a class="nav-link" href="{% url 'lista_emprestimos' %}">Empréstimos</a></li>
            </ul>
        </div>
    </nav>

    <!-- Container do Conteúdo Principal -->
    <div class="container">
        <div class="main-container">
            {% block conteudo %}
            {% endblock %}
        </div>
    </div>

</body>
</html>
